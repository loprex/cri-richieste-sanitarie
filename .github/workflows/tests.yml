name: CRI backend security regressions
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: node --check app/static/form.js
      - run: node --check app/static/admin.js
      - run: node tests/test_admin_display.cjs
      - run: python -m pytest -q tests/

